# ============================================================
# 配置模板
#
# 使用方法：
#   1. 复制本文件为 application.yml
#   2. 把下面所有 <YOUR_...> 替换成真实值
#
# 注意：application.yml 已被 .gitignore 排除，不会提交到公开仓库。
#       请勿把真实密钥写回本文件。
# ============================================================

server:
  port: 8080
  address: 127.0.0.1

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/blog?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
    username: root
    password: <YOUR_MYSQL_PASSWORD>
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  redis:
    host: localhost
    port: 6379
    password: <YOUR_REDIS_PASSWORD>

  mail:
    host: smtp.qq.com
    port: 587
    username: <YOUR_EMAIL>
    password: <YOUR_EMAIL_AUTH_CODE>
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: <YOUR_JWT_SECRET>
    expiration-ms: 86400000
  ai:
    api-key: <YOUR_AI_API_KEY>
    api-url: https://api.xiaomimimo.com/v1/chat/completions
    model: mimo-v2-flash

cos:
  secret-id: <YOUR_COS_SECRET_ID>
  secret-key: <YOUR_COS_SECRET_KEY>
  region: ap-shanghai
  bucket-name: <YOUR_COS_BUCKET_NAME>
  base-url: https://<YOUR_COS_BUCKET_NAME>.cos.ap-shanghai.myqcloud.com/
